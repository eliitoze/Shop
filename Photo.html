<div style="max-width:500px;margin:auto;padding:20px;background:#111;color:white;font-family:sans-serif">
<h2 style="text-align:center">💎 Jewel360 - Fixed</h2>
<input type="password" id="k1" placeholder="Key 1 - sk_live_xxx" style="width:100%;padding:10px;margin:10px 0;background:#333;color:white;border:none;border-radius:5px">
<input type="password" id="k2" placeholder="Key 2 - Optional" style="width:100%;padding:10px;margin:10px 0;background:#333;color:white;border:none;border-radius:5px">
<button onclick="localStorage.setItem('k1',k1.value);localStorage.setItem('k2',k2.value);alert('Saved')" style="width:100%;padding:10px;background:#2563eb;color:white;border:none;border-radius:5px;margin-bottom:20px">Save Keys</button>
<input type="file" id="img" accept="image/*" style="width:100%;margin-bottom:10px;color:white">
<button onclick="go()" style="width:100%;padding:15px;background:#16a34a;color:white;border:none;border-radius:5px;font-weight:bold">Generate Black BG</button>
<div id="out" style="margin-top:20px"></div>
</div>
<script>
k1.value=localStorage.getItem('k1')||'';k2.value=localStorage.getItem('k2')||'';
async function go(){
const f=img.files[0];if(!f)return alert('Photo select karo');
const key=localStorage.getItem('k1');if(!key)return alert('Key 1 nakho');
let d=new FormData();d.append('image_file',f);d.append('bg_color','000000');d.append('format','png');
out.innerHTML='<p style="text-align:center">Loading... 10-15 sec lagse</p>';
try{
// CORS પ્રોક્સી વાપરીએ છીએ
let url='https://corsproxy.io/?'+encodeURIComponent('https://sdk.photoroom.com/v1/segment');
let r=await fetch(url,{method:'POST',headers:{'x-api-key':key},body:d});
if(r.status===402||r.status===429){
  const k2=localStorage.getItem('k2');if(!k2)throw Error('Key 1 limit puri, Key 2 nakho');
  out.innerHTML='<p style="text-align:center">Key 1 puri, Key 2 try karu chu...</p>';
  r=await fetch(url,{method:'POST',headers:{'x-api-key':k2},body:d})
}
if(!r.ok)throw Error('API Error '+r.status);
let b=await r.blob();let u=URL.createObjectURL(b);
out.innerHTML=`<img src="${u}" style="width:100%;border-radius:8px;margin-bottom:10px"><a href="${u}" download="jewel_black.png" style="display:block;padding:12px;background:#2563eb;color:white;text-align:center;border-radius:5px;text-decoration:none;font-weight:bold">⬇️ Download Photo</a>`;
}catch(e){out.innerHTML='<p style="color:#f87171">Error: '+e.message+'<br><br>Check karo: 1) Key sahi chhe? 2) Internet chhe? 3) Credits baki chhe?</p>'}
}
</script>
