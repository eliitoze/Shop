<style>
/* ===== THERMAL PRINT 58mm ===== */
@media print {
  * { visibility: hidden !important; }
  #thermalPrint, #thermalPrint * { visibility: visible !important; }
  #thermalPrint {
    position: fixed !important;
    top: 0 !important; left: 0 !important;
    width: 100% !important;
    display: block !important;
  }
  @page { size: 58mm auto; margin: 2mm 1mm; }
}

#thermalPrint {
  display: none;
  width: 58mm;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.6;
  color: #000;
  background: #fff;
  padding: 3mm 2mm;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
.tp-center { text-align: center; }
.tp-bold { font-weight: bold; }
.tp-shop { font-size: 14px; font-weight: bold; text-align: center; letter-spacing: 0.5px; }
.tp-dash { border-top: 1px dashed #000; margin: 4px 0; }
.tp-solid { border-top: 2px solid #000; margin: 4px 0; }
.tp-row { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; margin: 2px 0; }
.tp-item { font-size: 11px; font-weight: 600; margin: 3px 0 0; }
.tp-item-sub { display: flex; justify-content: space-between; font-size: 11px; padding-left: 3px; color: #000; margin-bottom: 3px; }
.tp-total { display: flex; justify-content: space-between; font-weight: bold; font-size: 12px; margin: 3px 0; }
.tp-grand { font-size: 14px; font-weight: bold; }
.tp-footer { text-align: center; font-size: 10px; font-weight: 600; margin-top: 6px; line-height: 1.6; }

/* ===== MAIN APP ===== */
:root {
  --bg: #0a0a0f;
  --s1: #111118;
  --s2: #18181f;
  --s3: #22222c;
  --border: #2a2a38;
  --accent: #6ee7b7;
  --accent2: #34d399;
  --yellow: #fbbf24;
  --red: #f87171;
  --blue: #60a5fa;
  --purple: #a78bfa;
  --text: #f0f0f5;
  --muted: #6b7280;
  --sw: 240px;
  --card: #111118;
}
/* LIGHT MODE */
body.light-mode {
  --bg: #f5f5f8;
  --s1: #ffffff;
  --s2: #f0f0f4;
  --s3: #e8e8ed;
  --border: #d1d1db;
  --accent: #059669;
  --accent2: #047857;
  --yellow: #d97706;
  --red: #dc2626;
  --blue: #2563eb;
  --purple: #7c3aed;
  --text: #111118;
  --muted: #6b7280;
  --card: #ffffff;
}
body.light-mode .sync-dot { background: #059669; }
body.light-mode .stat-card.green { background: rgba(5,150,105,0.1); border-color: rgba(5,150,105,0.3); }
body.light-mode .stat-card.yellow { background: rgba(217,119,6,0.1); border-color: rgba(217,119,6,0.3); }
body.light-mode .stat-card.blue { background: rgba(37,99,235,0.1); border-color: rgba(37,99,235,0.3); }
body.light-mode .stat-card.red { background: rgba(220,38,38,0.1); border-color: rgba(220,38,38,0.3); }
body.light-mode .btn-primary { background: #059669; }
body.light-mode .nav-item.active { background: rgba(5,150,105,0.15); color: #059669; }
body.light-mode .nav-item:hover { background: rgba(5,150,105,0.08); }
body.light-mode input, body.light-mode select, body.light-mode textarea { color: #111118 !important; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 13.5px;
  height: 100%;
}

/* SIDEBAR */
.sidebar {
  width: var(--sw);
  position: fixed;
  top: 0; left: 0; bottom: 0;
  background: var(--s1);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transition: transform 0.3s;
  z-index: 100;
  overflow-y: auto;
  overflow-x: hidden;
}

.logo {
  padding: 20px 18px 14px;
  border-bottom: 1px solid var(--border);
}
.logo-name {
  font-family: 'Syne', sans-serif;
  font-size: 18px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: -0.5px;
}
.logo-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

.sync-status {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  font-size: 11px;
  border-bottom: 1px solid var(--border);
  background: var(--s2);
}
.sync-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.sync-dot.offline { background: var(--red); animation: none; }
.sync-dot.syncing { background: var(--yellow); }

.nav { flex: 1; padding: 8px 0; overflow-y: auto; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 18px;
  cursor: pointer;
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  border-left: 2px solid transparent;
  transition: all 0.15s;
  margin: 1px 0;
}
.nav-item:hover { color: var(--text); background: var(--s2); }
.nav-item.active { color: var(--accent); background: rgba(110,231,183,0.07); border-left-color: var(--accent); }
.nav-icon { font-size: 15px; width: 20px; text-align: center; }

/* Per-page nav colors */
.nav-dashboard.active  { color:#6ee7b7; background:rgba(110,231,183,0.10); border-left-color:#6ee7b7; }
.nav-billing.active    { color:#a78bfa; background:rgba(167,139,250,0.10); border-left-color:#a78bfa; }
.nav-products.active   { color:#60a5fa; background:rgba(96,165,250,0.10);  border-left-color:#60a5fa; }
.nav-customers.active  { color:#f472b6; background:rgba(244,114,182,0.10); border-left-color:#f472b6; }
.nav-invoices.active   { color:#34d399; background:rgba(52,211,153,0.10);  border-left-color:#34d399; }
.nav-reports.active    { color:#fbbf24; background:rgba(251,191,36,0.10);  border-left-color:#fbbf24; }
.nav-advance.active    { color:#fb923c; background:rgba(251,146,60,0.10);  border-left-color:#fb923c; }
.nav-birthdays.active  { color:#f87171; background:rgba(248,113,113,0.10); border-left-color:#f87171; }
.nav-import.active     { color:#38bdf8; background:rgba(56,189,248,0.10);  border-left-color:#38bdf8; }
.nav-settings.active   { color:#94a3b8; background:rgba(148,163,184,0.10); border-left-color:#94a3b8; }

.nav-dashboard:hover  { color:#6ee7b7; background:rgba(110,231,183,0.05); }
.nav-billing:hover    { color:#a78bfa; background:rgba(167,139,250,0.05); }
.nav-products:hover   { color:#60a5fa; background:rgba(96,165,250,0.05); }
.nav-customers:hover  { color:#f472b6; background:rgba(244,114,182,0.05); }
.nav-invoices:hover   { color:#34d399; background:rgba(52,211,153,0.05); }
.nav-reports:hover    { color:#fbbf24; background:rgba(251,191,36,0.05); }
.nav-advance:hover    { color:#fb923c; background:rgba(251,146,60,0.05); }
.nav-birthdays:hover  { color:#f87171; background:rgba(248,113,113,0.05); }
.nav-import:hover     { color:#38bdf8; background:rgba(56,189,248,0.05); }
.nav-settings:hover   { color:#94a3b8; background:rgba(148,163,184,0.05); }

/* Sidebar gradient top */
.logo {
  padding: 20px 18px 14px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(110,231,183,0.08) 0%, transparent 100%);
}

/* Mobile nav active colors */
#mbn-dashboard.active { color:#6ee7b7; }
#mbn-billing.active   { color:#a78bfa; }
#mbn-invoices.active  { color:#34d399; }
#mbn-reports.active   { color:#fbbf24; }
#mbn-more.active      { color:#60a5fa; }
.mob-nav-item.active .mob-icon { filter: drop-shadow(0 0 6px currentColor); }

/* MAIN */
.main {
  margin-left: var(--sw);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  position: relative;
  z-index: 1;
}

.topbar {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  background-image: linear-gradient(90deg, rgba(110,231,183,0.04) 0%, transparent 60%);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
}
.topbar h2 { font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); }
.topbar-right { display: flex; align-items: center; gap: 8px; }

.content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 20px 20px;
  -webkit-overflow-scrolling: touch;
}

.page { display: none; position: relative; }
.page.active { display: block; }
#page-billing.active { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
@media (max-width: 768px) {
  #page-billing.active { overflow-y: auto; height: auto; display: block; -webkit-overflow-scrolling: touch; }
}

/* STATS */
.stats-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin-bottom: 16px; }
@media (min-width: 900px) { .stats-grid { grid-template-columns: repeat(4,1fr); } }

.stat-card {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  transition: transform 0.15s, box-shadow 0.15s;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; }
.stat-value { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; color: var(--text); margin-top: 5px; }
.stat-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.stat-card.green .stat-value { color: var(--accent); }
.stat-card.yellow .stat-value { color: var(--yellow); }
.stat-card.red .stat-value { color: var(--red); }
.stat-card.blue .stat-value { color: var(--blue); }

/* CARD */
.card {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
}
.card::before {
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background: linear-gradient(90deg, var(--accent), transparent);
  opacity: 0.4;
}
.card-title {
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 7px;
}

/* BILLING */
.billing-layout { display: flex; gap: 14px; min-height: 0; flex: 1; }
.bill-left { flex: 1; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; min-width: 0; }
.bill-right {
  width: 340px;
  flex-shrink: 0;
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
@media (max-width: 768px) {
  .billing-layout { flex-direction: column; height: auto; }
  .bill-right { width: 100%; }
}

/* FORM */
.form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.form-group { flex: 1; min-width: 120px; }
.form-group label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 9px 11px;
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
}
.form-group input:focus, .form-group select:focus { border-color: var(--accent); }
.form-group select option { background: var(--s2); }

/* BUTTONS */
.btn {
  padding: 9px 16px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: #0a0a0f; }
.btn-primary:hover { background: var(--accent2); }
.btn-ghost { background: var(--s2); color: var(--text); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger { background: rgba(248,113,113,0.12); color: var(--red); border: 1px solid rgba(248,113,113,0.25); }
.btn-yellow { background: rgba(251,191,36,0.12); color: var(--yellow); border: 1px solid rgba(251,191,36,0.25); }
.btn-blue { background: rgba(96,165,250,0.12); color: var(--blue); border: 1px solid rgba(96,165,250,0.25); }
.btn-wa { background: rgba(37,211,102,0.12); color: #25d366; border: 1px solid rgba(37,211,102,0.25); }
.btn-green { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
.btn-red { background: rgba(239,68,68,0.12); color: #ef4444; border: 1px solid rgba(239,68,68,0.25); }
.btn-print { background: rgba(167,139,250,0.12); color: var(--purple); border: 1px solid rgba(167,139,250,0.25); }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* TABLE */
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; }
th { padding: 9px 12px; text-align: left; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid rgba(42,42,56,0.6); font-size: 13px; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.02); }

/* BADGE */
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-green { background: rgba(110,231,183,0.12); color: var(--accent); }
.badge-red { background: rgba(248,113,113,0.12); color: var(--red); }
.badge-yellow { background: rgba(251,191,36,0.12); color: var(--yellow); }
.badge-blue { background: rgba(96,165,250,0.12); color: var(--blue); }

/* RECEIPT PANEL */
.rp-header { background: var(--s2); padding: 14px 16px; border-bottom: 1px solid var(--border); }
.rp-header h3 { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--accent); }
.rp-header p { font-size: 11px; color: var(--muted); margin-top: 2px; }
.rp-cust { padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
.rp-items { flex: 1; overflow-y: auto; padding: 4px 16px; }
.rp-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(42,42,56,0.5); }
.rp-iname { font-weight: 600; font-size: 13px; }
.rp-iqty { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }
.rp-iprice { font-family: 'DM Mono', monospace; font-weight: 500; color: var(--accent); font-size: 13px; }
.rp-idel { background: none; border: none; color: var(--red); cursor: pointer; font-size: 18px; opacity: 0.6; padding: 0 2px; }
.rp-idel:hover { opacity: 1; }
.rp-totals { padding: 12px 16px; border-top: 1px solid var(--border); background: var(--s2); }
.tot-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 13px; color: var(--muted); }
.tot-row.grand { font-family: 'DM Mono', monospace; font-size: 16px; font-weight: 500; color: var(--text); border-top: 1px solid var(--border); padding-top: 8px; margin-top: 5px; }
.tot-row.profit { color: var(--accent); font-weight: 600; font-size: 12px; }
.rp-actions { padding: 12px 16px; display: flex; gap: 7px; flex-wrap: wrap; }

/* PRODUCT CARDS */
.prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 10px; }
.prod-card {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 13px;
  transition: all 0.15s;
}
.prod-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.pc-name { font-weight: 600; font-size: 13px; margin-bottom: 2px; line-height: 1.3; }
.pc-sku { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; margin-bottom: 6px; }
.pc-price { font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500; color: var(--accent); }
.pc-profit { font-size: 11px; color: var(--accent2); margin-top: 2px; }
.pc-actions { display: flex; gap: 5px; margin-top: 8px; }

/* MODAL */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); padding: 16px; }
.overlay.open { display: flex; }
.modal {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 22px;
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
}
.modal h3 { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; margin-bottom: 16px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

/* PIN MODAL */
.pin-modal {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px 24px;
  width: 100%;
  max-width: 320px;
  text-align: center;
}
.pin-display {
  font-family: 'DM Mono', monospace;
  font-size: 28px;
  letter-spacing: 10px;
  color: var(--accent);
  margin: 16px 0;
  height: 40px;
}
.pin-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 12px; }
.pin-btn {
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  transition: all 0.1s;
}
.pin-btn:active { background: var(--accent); color: #000; transform: scale(0.95); }

/* LOADING */
.loading-overlay {
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* TOAST */
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--s2); border: 1px solid var(--border);
  color: var(--text); padding: 11px 18px; border-radius: 10px;
  font-size: 13px; font-weight: 500; z-index: 999;
  opacity: 0; transition: all 0.3s; white-space: nowrap;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5); max-width: 90vw;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.success { border-color: var(--accent); color: var(--accent); }
.toast.error { border-color: var(--red); color: var(--red); }
